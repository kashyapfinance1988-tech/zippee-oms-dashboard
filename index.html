<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Zippee Ops Command Center v63</title>
<style>body{font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#0b1f3a;color:#fff}#m{text-align:center}#s{opacity:.7;font-size:14px;margin-top:8px}</style>
</head>
<body>
<div id="m"><div style="font-size:22px;font-weight:800">Zippee Command Center</div><div id="s">Loading v63 FIXED…</div></div>
<script>
(async function(){
  var s=document.getElementById('s');
  try{
    var parts=[];
    for(var i=0;i<6;i++){
      s.textContent='Loading part '+(i+1)+'/6…';
      var r=await fetch('cc_part'+i+'.txt?v=63');
      if(!r.ok) throw new Error('part '+i+' HTTP '+r.status);
      parts.push(await r.text());
    }
    s.textContent='Starting dashboard…';
    var html=parts.join('');
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    s.textContent='Load failed: '+e.message+'. Try hard refresh (Ctrl+Shift+R).';
    s.style.color='#fca5a5';
  }
})();
</script>
</body>
</html>
